<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SQL Playground</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%234f46e5'/><g fill='none' stroke='white' stroke-width='2.2' stroke-linecap='round'><ellipse cx='16' cy='10' rx='7' ry='3'/><path d='M9 10v12c0 1.7 3.1 3 7 3s7-1.3 7-3V10'/><path d='M9 16c0 1.7 3.1 3 7 3s7-1.3 7-3'/></g></svg>" />
    <script>
      // apply the saved light/dark theme before the first paint (no flash)
      try {
        var t = localStorage.getItem('sqlpg.theme') || 'system';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
